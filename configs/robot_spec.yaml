# CargoBot-1 机器人参数规范
# 来源：docs/cargobot/02_机器人设计_CargoBot-1.md
#
# === 状态：已冻结（2026-11-05）===
# CargoBot-1 项目暂停，只保留设计文档与本参数表作为存档。
# 对应的 URDF/MJCF 生成器、仿真代码、pilot 数据已删除；恢复开发时
# 需按 docs/cargobot/ 的文档重新生成，不要直接引用旧路径。

robot:
  name: CargoBot-1

  # ===== 差速底盘 =====
  base:
    length: 0.85          # m，前后
    width: 0.65           # m，左右
    height: 0.16          # m，底盘本体高（不含轮）
    mass: 40.0            # kg（含电池、配重）
    wheel_radius: 0.10    # m，Ø200
    wheel_width: 0.05     # m
    wheelbase: 0.55       # m，轮距
    wheel_x: 0.0          # m，驱动轮轴心前后位置（车体中心为原点）
    caster_radius: 0.0375 # m，Ø75 万向轮
    caster_inset: 0.06    # m，万向轮距车体边角内缩
    max_speed: 1.0        # m/s
    max_accel: 0.5        # m/s^2
    max_slope_deg: 5.0
    max_step: 0.015       # m，越障 15 mm
    ground_clearance: 0.02

  # ===== 升降立柱 =====
  lift:
    min_height: 0.20      # m，立柱底到安装法兰的最小高度
    max_height: 1.50      # m，最大高度
    home_height: 0.20
    payload: 30.0         # kg
    speed: 0.10           # m/s
    mass_column: 8.0      # kg，立柱本体
    mass_carriage: 3.0    # kg，滑块+法兰
    section: 0.10         # m，立柱截面边长

  # ===== 7DoF 机械臂 =====
  arm:
    dof: 7
    reach: 0.95           # m，肩到夹爪中心
    payload: 8.0          # kg @0.7m
    payload_full: 5.0     # kg 全展
    mass_total: 22.0
    # 连杆可视长度（沿 +z），单位 m：肩座 / 上臂 / 前臂 / 腕×4
    link_lengths: [0.15, 0.35, 0.32, 0.06, 0.03, 0.03, 0.02]
    # S-R-S 构型：每个关节相对"父连杆坐标系原点"的偏移 (x,y,z)，与转轴
    # 约定：J_k 的 origin = 父连杆末端；即 Z 偏移等于父连杆长度
    # J1 肩偏航 / J2 肩俯仰 / J3 肘俯仰 / J4 上臂滚转 / J5 腕俯仰 / J6 腕滚转 / J7 腕俯仰
    joint_origins:
      - [0.0, 0.0, 0.25]   # J1：滑块顶面 → 肩（含 shoulder_offset）
      - [0.0, 0.0, 0.15]   # J2：肩座顶端
      - [0.0, 0.0, 0.35]   # J3：上臂顶端
      - [0.0, 0.0, 0.32]   # J4：前臂顶端
      - [0.0, 0.0, 0.06]   # J5
      - [0.0, 0.0, 0.03]   # J6
      - [0.0, 0.0, 0.03]   # J7
    gripper_mount: 0.02    # J7 → 夹爪基座的偏移
    joint_axes: ["0 0 1", "0 1 0", "0 1 0", "0 0 1", "0 1 0", "0 0 1", "0 1 0"]
    # 各连杆质量（kg），合计 19.0；夹爪 3.0 单独在 gripper.mass，臂总重 22.0
    link_masses: [4.5, 4.0, 3.5, 3.0, 1.5, 1.3, 1.2]
    # 连杆外径，用于生成碰撞几何（圆柱）
    link_radii: [0.09, 0.075, 0.065, 0.055, 0.045, 0.040, 0.035]
    joint_limits_deg: [-170, 170]
    wrist_limit_deg: [-180, 180]
    max_joint_speed_deg: 90
    max_torque: [200, 200, 200, 120, 40, 40, 40]
    # 肩关节安装高度 = 升降法兰 + 该偏移
    shoulder_offset: 0.25

  # ===== 宽开口二指夹爪 =====
  gripper:
    opening_min: 0.02
    opening_max: 0.50
    stroke: 0.48
    force: 400            # N
    closing_speed: 0.10   # m/s
    mass: 3.0
    # m，含手指（掌 0.06 + 指 0.12）。指板接触区从箱前沿往里覆盖
    # body_length − 掌厚，必须超过箱深的一半，否则重心落在指板之外、
    # 箱子绕指端翻倒（实测 0.18 m 指板夹 300 mm 箱，Rzz 从 1.00 掉到 0.81）。
    # 0.22 → 覆盖 0.16 m > 0.15 m（箱深一半），同时不至于把箱子带进上层板。
    body_length: 0.22
    finger_thickness: 0.02
    # m，指板沿箱高的覆盖高度。0.10 时只夹住箱子下半部，重心在上方产生
    # 倾覆力矩，实测 Rzz 从 1.00 缓慢掉到 0.73、箱子最终滑脱。
    # 0.24 覆盖 0.30 m 箱高的 80%，握持稳定。
    finger_height: 0.24
    # 指板物理长度（与 TCP 解耦）。TCP 由 body_length 定，指板可以更长，
    # 让接触区跨过箱体重心。不填时回退到 body_length − 掌心厚度。
    finger_length: 0.16
    # 指尖托钩（把「摩擦夹持」换成「形状约束」）。坐标系同指板：
    # 局部 +x → 世界 −z（向下）。整个托钩位于箱底以下。
    hook_center: 0.165        # m，相对 TCP 的下沉量
    hook_drop: 0.03           # m，托钩沿下沉方向的厚度
    hook_reach: 0.04          # m，托钩从指板侧面伸出的长度
    hook_width: 0.05          # m，托钩沿指板宽度的尺寸

  # ===== 传感器 =====
  # 2026-11-10 按真机重写：见 configs/vla_spec.yaml 的 cameras 段（唯一真源）
  # 与 simulation/mujoco/p30_rm65_scene.xml 的 front_cam / arm_cam。
  sensors:
    # 狗前方 front_0：装在 TRUNK.STL 前脸的内凹面板里（开口 117 x 67 mm，
    # 用户在实拍图上圈出的黑面板）。传感器 Gemini 336L，27 x 124 x 29 mm。
    # 正前方下俯 45°：实测抓取位目标可见 27.11%、自遮挡 58.7%；
    # 更浅会看不到夹爪深处，更俯就只看到桌面。详见场景 XML 的注释。
    front_camera:
      mjcf_name: front_cam
      pos: [0.3900, 0.0, 0.0481]   # 相对 base_link（x 前，y 左，z 上）
      pitch_deg: -45.0             # 下俯
      roll: 0.0                    # 画面右 = 世界 -y（狗朝 +x 的常规装法）
      width: 320
      height: 240
      fov_deg: 70                  # 真机内参待标定
      rate: 30
    # 臂上相机（手眼）：装在 Dex1-1 夹爪 base_link.STL 顶部凸台
    # （唯一的相机座，官方 URDF 没有 camera node）。
    # 取大台面前缘 y=0.0575、贴面 z=0.0650，光轴朝夹持方向下俯 40°。
    # 眼在手紧贴夹爪，目标占 2~6% 属正常；40° 四阶段可见度最均衡。
    arm_camera:
      mjcf_name: arm_cam
      pos: [0.0, 0.0575, 0.0650]   # 相对 gripper_base
      pitch_deg: -40.0
      width: 320
      height: 240
      fov_deg: 85
      rate: 30
    third_camera:
      pos: [-1.5, 1.5, 2.0]      # world 系，固定机位
      rate: 15
    lidar:
      pos: [0.0, 0.0, 0.18]
      fov_deg: 360
      range: 20.0
      rate: 10
    imu:
      pos: [0.0, 0.0, 0.10]
      rate: 100

  # ===== 命名（与 55 维 schema 对齐）=====
  naming:
    base_link: base_link
    lift_joint: lift_joint
    lift_link: lift_carriage
    arm_joints: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6, arm_joint7]
    arm_links: [arm_link1, arm_link2, arm_link3, arm_link4, arm_link5, arm_link6, arm_link7]
    tcp_frame: tcp
    gripper_finger_left: gripper_finger_left
    gripper_finger_right: gripper_finger_right
    gripper_joint_left: gripper_joint_left
    gripper_joint_right: gripper_joint_right
