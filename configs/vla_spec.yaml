# VLA 接口规范（唯一真源）
#
# 采集脚本、导出脚本、训练配置、推理端都从这里读，避免维度/键名对不上。
# 已知踩过的坑：state 维度改了但 modality.json 没改、相机 key 改了但导出没改，
# 都会让训练数据静默错位（不报错，只是学不会）。

version: 1

# ===== 相机 =====
# 两路相机都必须是**真机上存在的**，位置来自实测/实拍，不是仿真里自己搭的。
# 2026-11-10 修正：旧 head_cam 立在自造立柱（z=0.240）上，比躯干最高点
# 高 66.4 mm，真机没有这个硬件；旧 wrist_cam 悬在夹爪后方 104.7 mm 空中。
# 现在两路分别对应真机的 front_0 和臂上相机。
cameras:
  front:
    mjcf_name: front_cam       # 场景里的名字
    dataset_key: observation.images.front_cam
    width: 320
    height: 240
    note: >-
      狗前方 front_0，装在躯干前脸内凹面板（TRUNK.STL x≈390mm，开口
      117×67mm，即用户在实拍图上圈出的黑面板），正前方下俯 45°、fovy 70。
      提供全局定位与干扰物信息。
      实测（settle 后）预抓/悬停/抬升位目标可见 42.59%、抓取位 27.11%、
      抓取位机械臂自遮挡 58.7%。注意：不 settle 直接写 qpos 会得到偏乐观
      的数字，历史表格里 5.04% 那组就是这么来的，已作废。
  arm:
    mjcf_name: arm_cam
    dataset_key: observation.images.arm_cam
    width: 320
    height: 240
    note: >-
      机械臂上的相机，装在 Dex1-1 夹爪顶部凸台（base_link.STL 实测
      x±18mm / y 22.8~57.0mm / z 50~92mm），从凸台前面沿 +y 下俯 40°、
      fovy 85。眼在手，抓取瞬间精度靠它。
      实测（settle 后）：预抓 2.09%、悬停 4.34%、抓取 4.53%、抬升 3.71%，
      自遮挡 31.7%~37.0%。数字偏小是因为夹爪本体就在镜头前，正常。

# ===== 状态（模型输入）=====
state:
  joint:
    key: single_arm
    dim: 6
    names: [arm_joint1, arm_joint2, arm_joint3, arm_joint4, arm_joint5, arm_joint6]
    unit: rad
    note: 记录**命令值**而非实测值。实测值有重力稳态误差（命令 +2° 实动 0.32°），
          用它训练会导致模型永远抬不起来。这是 V7 之前反复失败的老坑。
  eef_pose:
    key: eef_9d
    dim: 9
    layout: [x, y, z, R00, R01, R02, R10, R11, R12]
    frame: world_minus_arm_base_xy
    note: >-
      pos = 世界 xpos - ARM_BASE：**xyz 三个分量都相对臂座**。
      采集脚本 write 的 arm_base = [0.06, 0, 0.71]，export 的 build_fk 也是
      `site_xpos - arm_base`；抓取帧实测 z=-0.118 = 0.592-0.710，坐实 z 也
      是相对量。（2026-11-09 之前本文写「z 是世界高度」是错的，已订正；
      部署端 get_state/actuate_pose 同步改为三维全减/全加 ARM_BASE。）
      rot6d = 世界系旋转矩阵**前两行** flatten（R[:2,:]，不是前两列），
      **不旋转到臂基座系**。臂座 yaw=180°，旋转到臂座系会让 x/y 反号。
      2026-11-06 以 collect_color_grasp.eef_state() 为准判定，
      deployment/hal/mujoco_backend.get_state()/actuate_pose() 已统一为
      同一口径（互为逆变换）。
      **site 基准 = grasp_site（夹持面中心），不是法兰 eef_site**（2026-11-09）。
      两者沿工具轴差 0.1113 m；旧口径学法兰、执行端却当夹持面解 IK，
      实测末端系统性高 9.93 cm。采集/导出/仿真/部署全部改为 grasp_site，
      执行端不再有任何 GRASP_SITE_UP 偏移换算。
  gripper:
    key: gripper_position
    dim: 1
    range: [0.0, 1.0]
    note: 0 = 闭合，1 = 张开。由 qpos 线性映射：
          grip = (0.0245 - q) / (0.0245 - (-0.020))
  # 拼接顺序（2026-11-13 起，与 export_color_lerobot.py:365 一致）：
  #   eef_9d(9) + gripper_position(1) + single_arm(6)
  # 旧的 single_arm 在前布局已废弃；顺序错了模型会把关节角当成 eef 位置。
  total_dim: 16
  layout_slice:
    eef_9d: [0, 9]
    gripper_position: [9, 10]
    single_arm: [10, 16]

# ===== 动作（模型输出）=====
action:
  # === 路线甲（2026-11-06 用户拍板）：底盘进 VLA，13D ===
  # choice 指向的方案就是当前契约；10D 的 v1（路线乙）保留在下方作记录。
  # 「机械臂只收末端位姿、IK 由控制器算」=> 臂永远不输出关节。
  choice: A_eef_base_absolute

  # ---- v2 当前采用：13D 绝对 EEF + 底盘速度（任务谱系 A→C，B 不入范围）----
  # 本节是 tools/check_modality.py 与部署拆包的对照基准，改这里前先改数据。
  A_eef_base_absolute:
    eef_9d:
      dim: 9
      layout_slice: [0, 9]
      frame: world_minus_arm_base_xy   # 与 state.eef_pose 同口径，逐帧自洽
      format: XYZ_ROT6D
      rep: ABSOLUTE   # 底盘移动下 RELATIVE 的 T0^-1@Tt 不成立，必须直通
      note: 执行端逐帧用当帧臂座解释；site = grasp_site（夹持面中心）
    gripper_position:
      dim: 1
      layout_slice: [9, 10]
      range: [0.0, 1.0]
    base_velocity:
      dim: 3
      layout_slice: [10, 13]
      frame: body                     # 机体系（G1 navigate_command 同款）
      unit: [m_s, m_s, rad_s]
      layout: [vx, vy, wz]
      rep: ABSOLUTE
      note: 连续速度指令不是目标位姿；L3 缺键注入 0 + 看门狗
    total_dim: 13
  total_dim: 13

  # ---- v1 历史方案：10D 绝对 EEF（路线乙：底盘不进 VLA）----
  # 数据集 color_gr00t（v1）按此采集；已采数据仍按这节解释。
  A_eef_9d_absolute:
    eef_9d:
      dim: 9
      layout_slice: [0, 9]
      frame: world_minus_arm_base_xy
      format: XYZ_ROT6D
      note: 存绝对值；相对化由 GR00T processor 按 RELATIVE 声明做且只做一次
    gripper_position:
      dim: 1
      layout_slice: [9, 10]
      range: [0.0, 1.0]
    total_dim: 10

  # ---- 方案 A：相对 EEF 增量（与 docs/P30_RM65_移动操作技术方案.md §4.2 一致）----
  # 优点：跨本体表示，GR00T N1.7 原生支持；抗相机外参误差；便于 action chunking。
  # 代价：执行端需要 IK，IK 误差会进闭环。本场景 IK 已验证 1e-3 以内，可接受。
  A_relative_eef_delta:
    eef_delta:
      dim: 6
      layout: [dx, dy, dz, drx, dry, drz]
      frame: arm_base      # 增量在臂基座坐标系下表达
      unit: [m, m, m, rad, rad, rad]
    gripper:
      dim: 1
      range: [0.0, 1.0]
      note: 目标开度（绝对值，不是增量）
    total_dim: 7

  # ---- 方案 B：绝对关节角（旧 B2+RM65 项目最终采用的路线）----
  # 依据：旧项目调研官方 examples/DROID/main_gr00t.py，DROID 真实机器人 eef_9d
  #       只作 state 输入，执行的 action 是 joint_position，RobotEnv 直接下发关节角、
  #       完全无 IK。旧项目因此改用关节角。
  # 缺点：旧项目最终闭环仍未通关（抬升失败），但当时还有相机全黑等别的问题，
  #       不能据此判定关节角路线本身不行。
  B_joint_position:
    joint:
      dim: 6
      unit: rad
      note: 命令值（非实测值），执行端 d.ctrl[:6] 直接下发
    gripper:
      dim: 1
      range: [0.0, 1.0]
    total_dim: 7

  control_rate_hz: 30      # 动作块频率；MuJoCo 物理步 500Hz，每块内插到 16.7 步
  # === 块长 ===
  # chunk_size 40 = GR00T ckpt 的 action_horizon（见
  #   configs/gr00t/rm65_config.py 的 ACTION_HORIZON）。设小不报错，
  #   只是白扔模型算出来的余量。
  # execute_steps 15：30 Hz 下 500 ms 执行窗口，把推理藏进执行期。
  #   官方 RTC 建议执行 >=32 步更平滑，等 Thor 实测出真实延迟再调。
  chunk_size: 40
  execute_steps: 15

# ===== 语言指令 =====
language:
  template: "抓取{color}的方块"
  colors: [红色, 绿色, 蓝色, 黄色]
  # 采集时按目标色生成指令；训练时同一条指令重复 4 次不重复采样
  variants:
    - "抓取{color}的方块"
    - "把{color}的方块拿起来"
    - "pick up the {color_en} cube"
  color_en: {红色: red, 绿色: green, 蓝色: blue, 黄色: yellow}

# ===== 任务定义 =====
task:
  name: color_conditioned_grasp
  success:
    lift_delta_min: 0.05     # 物体相对抓取前抬升 > 5 cm
    color_match: true        # 抓到的物体颜色必须等于指令颜色
    no_disturb: true         # 干扰物不得被推落台面
  episode_max_steps: 300     # 30 Hz × 10 s

# ===== 数据规模 =====
dataset:
  phase1_episodes: 150       # 打通链路
  phase2_episodes: 600       # 提升泛化
  fps: 30
  # 失败恢复轨迹也要采：约 15%，否则模型没见过出错状态
  failure_ratio: 0.15

# ===== 模型选型 =====
# 2026-11-09 定稿：**只用 GR00T N1.7，τ0 下线**。
# τ0 曾在 Thor 实测跑通（352 ms / 2.8 Hz / 5.0 GB），但它的 40D 动作空间
# 与我们的 13D 契约要经过 unified40 转换、且预训练 ckpt 不带 norm_stats，
# 维护成本翻倍。GR00T 的 eef_9d 口径与本 spec 天然一致（官方 processor
# 自带归一化，随 ckpt 走），所以只保留一条路线。
# 硬件：微调需 40GB+ 显存；Thor 只做推理。
model:
  primary: gr00t_n1_7
  base_ckpt: "nvidia/GR00T-N1.7-3B"
  note: 用本仓库导出的 LeRobot v2.1 数据集微调；推理端见 deployment/policy/gr00t_client.py
