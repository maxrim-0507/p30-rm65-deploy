# 机械臂安装参数（唯一真源）
#
# build_scene.py / ik_core / 采集脚本都从这里读，不要再散落硬编码。
# 换安装位置时只改这个文件，然后重跑：
#   python build_scene.py && python make_reach_mask.py && python verify_physics.py
#
# 坐标系：狗身 base_link 原点在躯干几何中心，x 朝狗头，z 朝上，y 朝左。
# 单位：米 / 度。
#
# ============================================================
# 本次安装位置由 PRD03973659.stl（整机装配体）反解，三种独立方法互验：
#   1. 法兰圆：z=207..208 一圈 787 点，r=35.000 std=0.031，圆心 (59.99,-0.04)
#   2. mesh 配准：官方 RM65 base_link.STL 暴力搜索，代价最小处
#        x=60.0 y=0.0 z=109.8 yaw=180.2°
#      （yaw 判别：180° 中位距离 1.48mm/<2mm 占 55.6%；
#        0° 是 6.44mm/10.6%，90° 与 -90° 更差 —— 唯一最优）
#   3. 装配体分层：转接板 = 连通分量 13，X[-140,140] Y[-109.5,109.5] Z[95,110]
#      臂底座壳 = 连通分量 34，Z[110,221]，底面正好坐在板顶 110
#   参照系已锁定：官方 P30W TRUNK.STL 包围盒
#       X[-427.5,406.3] Y[±156.6] Z[-86.8,153.6]
#     与装配体里对应分量逐位相同 => STL 原点就是 base_link 原点，+x 朝狗头。
#   臂安装点下方的躯干顶面：射线逐点投射，x 4..120 × |y|<56 全为 95.0mm
#     （整机最高 153.6 在 x≈230 的尾背凸起，不在安装点，不能拿来当安装面）
# ============================================================

mount:
  # ---- 机械臂基座原点（RM65 arm_base_link 的原点，含底座 mesh 底面）----
  x: 0.060          # 前后：正值朝狗头。STL 法兰轴线 x=59.99
  y: 0.000          # 左右偏置。STL 法兰轴线 y=-0.04
  # z 直接给「臂底座 mesh 底面」的世界高度，不再从 trunk_top_z 反推：
  # STL 里躯干顶面 95mm、转接板 95..110、臂底面 110，链条是 0.695→0.710。
  # 早期把 trunk_top_z 写成 0.754（整机最高点）会让臂悬空 59mm。
  z: 0.710

  # ---- 基座朝向：绕 z 轴的 yaw，0 = 基座 x 轴朝狗头 ----
  # 180°：两条独立判据一致 ——
  #   a) STL 里底座的偏心方向与 mesh 反向，配准代价 1.48mm vs 0° 的 6.44mm；
  #   b) 用户在 Thor 实机 viewer 里目视确认 180° 才是正确的转法。
  # 这只转底座本身；臂的「朝前」由 joint1 补偿（见 ARM_STOW_DEG 的 joint1 仍未动，
  # 靠 joint2/3 的符号翻转来补偿底座翻转）。
  yaw_deg: 180.0

  # ---- 上装转接板 ----
  # 按 STL 连通分量 13 的实际尺寸：280 x 219 x 15 mm
  plate:
    half_x: 0.140   # 半长（x），280/2
    half_y: 0.1095  # 半宽（y），219/2
    half_t: 0.0075  # 半厚（z），总厚 15 mm（STL z 95..110）
    # 板底面坐在躯干顶面上；臂基座 z 自动取板顶面，
    # 保证「躯干顶面 → 板 → 臂底座」三层严丝合缝
    sits_on: trunk_top

# 躯干在**臂安装点正下方**的顶面高度（射实测，不是整机最高点）
# P30W 官方 URDF 站立时 base_link z=0.600，STL local 95mm => 0.695
trunk_top_z: 0.695

# 工作台
#
# === 两条硬边界：前轮 + 躯干前脸 ===
# 台面是一整块从地面起到 top_z 的实体，所以它的**前沿(x 下界)**必须同时
# 让开两个东西，否则要么轮子穿模、要么躯干前脸抠进台面：
#   前轮几何   x 到 0.3963（轮心 0.2867 + mesh 半径 0.1097；
#              站立位姿改过之后轮心 x 仍是 0.2867，和官方 footprint 一致）
#   躯干 mesh  x 到 0.4063，z 从 0.5133 起 —— 台面 0.650 高于它，
#              所以即使 x 让开了轮子也别再往回收，否则台面会切进躯干前脸
# 取 x 下界 0.42：比躯干前脸多 14 mm，比轮子多 24 mm。
#
# === 2026-11-11 台高改成 0.650（实桌可改高度）===
# 0.55 是在「pre=+0.20 竖直抬起」的前提下定的。抓取点 z=台面+42mm：
#   台面 0.55 -> z=0.592，臂座 0.710，pre 抬到 0.792（高于臂座 82mm）
#   台面 0.65 -> z=0.692，臂座 0.710，pre=+0.20 会到 0.892，整链大面积无解
# 实测（整链校验，84 点网格）：
#   台高 0.65 + 旧参数(pre=0.20/lift=0.12)：24/84 可用
#   台高 0.65 + 新参数(pre=0.06/lift=0.05)：66/84 可用
#   台高 0.55 + 新参数                     ：70/84 可用
# 所以台高本身不是瓶颈，竖直预抓高度才是。详见 ik_core.approach_points。
table:
  top_z: 0.650
  center_x: 0.710         # x [0.42, 1.00]
  half_x: 0.290
  half_y: 0.300

# 物体随机化范围（保守内缩，须整体落在可达区 ∩ 台面内）
#
# === 三条硬约束，改之前先算 ===
# 1) 可达性：65cm 台面、pre=0.06/lift=0.05 下，整链实测（2026-11-11）
#      x=0.45  y ±0.20      x=0.48  y ±0.18
#      x=0.46  y ±0.20      x=0.50  y ±0.14      x=0.52 无解
# 2) **必须整体落在台面上**：方块中心离台面边缘至少 cube_half，
#    否则方块半悬空会翻落地面，采集出来是「抬升 -0.001 m」的假失败。
#    台面左缘 0.42 + 0.03 = 0.45 是下界。
# 3) x 实际可用带宽 0.45..0.50（5cm 四列），方块靠 y 铺开。
#
# === 「可达」必须按完整接近链算，不能只看抓取点 ===
# 接近路径是 pre -> hover -> grasp -> lift。旧参数 pre=+0.20 / hov=+0.10 /
# up=+0.12 在 0.55 台面上就把 x=0.52 整列判死；换到 0.65 台面更严重。
# 现在默认 pre=+0.06 / hov=+0.03 / up=+0.05（见 ik_core），整链可用列见上。
#
# === 为什么 count 仍是 4 ===
# 红绿蓝黄各一个，指令-物体一一对应，最干净。要加密度优先改小方块
# （夹爪指垫 54x28mm，边长上限约 80mm），不是改这里。
objects:
  # 真实可用形状由 reach_mask.json 决定（采集脚本按掩膜选点）；
  # 这里给的是外框，够用即可。
  x_range: [0.440, 0.500]
  y_range: [-0.200, 0.200]
  cube_half: 0.030      # 边长 60 mm，已验证夹得住
  count: 4
